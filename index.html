<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matheforscher · Interaktives Tafelbild</title><style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#292b2b;background:#fff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e47d3a;outline-offset:3px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid #e5e5e5;background:#fafafa}.toolbar .name{font-weight:700;font-size:17px;margin-right:auto}.toolbar button,.settings button{background:#fff;border:1px solid #bbb;border-radius:7px;padding:8px 13px;color:#333}.toolbar button.active{background:#252525;color:#fff;border-color:#252525}.toolbar button.primary{background:#2c6354;color:#fff;border-color:#2c6354}.settings{padding:16px 22px;background:#f7f7f5;border-bottom:1px solid #ddd;display:flex;gap:18px;flex-wrap:wrap;align-items:center}.settings[hidden], [hidden]{display:none!important}.settings label{display:flex;align-items:center;gap:6px}.settings input[type=number]{width:78px;padding:7px}.settings select{padding:7px}.settings fieldset{border:1px solid #ddd;display:flex;gap:12px;flex-wrap:wrap;border-radius:7px}.settings legend{font-size:13px;color:#666}.board{max-width:1700px;margin:auto;padding:clamp(12px,2.6vw,40px)}.mainrow{display:grid;grid-template-columns:minmax(260px,1.3fr) minmax(225px,.9fr) minmax(240px,.9fr);gap:clamp(18px,3vw,55px);align-items:center;min-height:350px}.panel{min-width:0;position:relative}.pane-actions{display:flex;justify-content:center;gap:10px;margin-top:15px}.smallbtn{border:1px solid #d4d4d4;background:#fff;color:#444;padding:6px 11px;border-radius:6px;font-size:13px}.smallbtn:hover{background:#f2f2f2}.dienes svg{width:100%;height:auto;max-height:330px;display:block}.tables{display:grid;gap:28px}.neighbor{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:center;text-align:center;position:relative;min-height:138px}.neighbor:before{content:'';position:absolute;left:0;right:0;top:54px;border-top:3px solid #373737}.neighbor .cell{position:relative;min-height:136px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 14px}.neighbor .cell.middle{border-left:3px solid #373737;border-right:3px solid #373737}.neighbor .head{font-size:clamp(24px,3.1vw,46px);font-weight:600;color:#e53e20;line-height:1.1;background:white;padding:0 4px;z-index:1}.neighbor .head.center{color:#343434;font-size:clamp(23px,2.8vw,40px)}.neighbor .val{font-size:clamp(27px,3.3vw,50px);font-weight:400;line-height:1.2;background:white;z-index:1;min-width:35px}.neighbor .val.hiddenval{color:transparent}.equations{display:grid;gap:23px}.eq{border:2px solid #555;min-height:84px;display:flex;align-items:center;justify-content:center;gap:clamp(5px,.7vw,12px);padding:8px 12px;white-space:nowrap;font-size:clamp(24px,2.5vw,39px)}.eq .blank{display:inline-block;min-width:1.55em;text-align:center;border-bottom:2px solid #555;line-height:1.3;color:#333}.eq .blank.open{color:transparent}.linewrap{margin-top:24px;border-top:1px solid #e5e5e5;padding-top:18px}.linewrap svg{width:100%;height:auto;display:block;max-height:170px}.caption{font-size:14px;color:#666;text-align:center}.panda{font-size:20px}.det-title{text-align:center;font-size:clamp(24px,3vw,40px);font-weight:500;margin:15px 0 10px}.det-sub{text-align:center;color:#666;margin:0 0 25px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.choice{background:#fff;border:2px solid #d0d0d0;border-radius:8px;min-height:230px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;color:#333}.choice .letter{font-size:26px;font-weight:bold}.choice .visual{width:100%;display:flex;justify-content:center;align-items:center;min-height:145px}.choice .visual svg{width:100%;max-width:330px;height:auto}.choice .visual .big{font-size:34px;font-weight:600}.choice .visual .small{font-size:19px}.choice .visual .mathline{font-size:30px}.choice .visual .pv{display:grid;grid-template-columns:1fr 1fr;width:85%;border:2px solid #555;text-align:center}.choice .visual .pv div{padding:8px;border-right:1px solid #555}.choice .visual .pv div:nth-child(2n){border-right:0}.choice .visual .pv .pvhead{background:#f5f5f5;border-bottom:2px solid #555;font-size:23px}.choice .visual .pv .pvval{font-size:45px}.choice .visual .pv .pvval:nth-child(3){border-right:1px solid #555}.choice .visual .pv .pvval:nth-child(4){border-right:0}.choice .statement{font-size:clamp(20px,2.7vw,36px);text-align:center;line-height:1.35}.choice.correct{border-color:#2c8060;background:#f0f9f3}.choice.wrong{border-color:#c95d48;background:#fff4f0}.feedback{text-align:center;font-size:20px;min-height:30px;margin:20px}.center-actions{text-align:center;margin:20px}.center-actions button{background:white;border:1px solid #aaa;border-radius:7px;padding:10px 18px}.muted{color:#777}.footnote{text-align:center;color:#777;font-size:13px;padding:8px}.hidecontrols .toolbar{display:none}.hidecontrols .pane-actions{display:none}.hidecontrols .board{padding-top:30px}@media(max-width:950px){.mainrow{grid-template-columns:1fr 1fr;gap:25px}.dienes{grid-column:1/-1}.dienes svg{max-height:250px}.choices{gap:8px}.choice{min-height:180px}}@media(max-width:620px){.mainrow{grid-template-columns:1fr}.dienes{grid-column:auto}.choices{grid-template-columns:1fr}.choice{min-height:130px}.neighbor{max-width:450px;margin:auto}.equations{max-width:450px;margin:auto;width:100%}}@media print{.toolbar,.settings,.pane-actions,.center-actions{display:none!important}.board{padding:10px}.choice{break-inside:avoid}}

.choice{font:inherit;cursor:pointer;position:relative;transition:border-color .15s,background .15s,box-shadow .15s;min-width:0}.choice:hover{border-color:#547caa;background:#f8fbff}.choice:focus-visible{outline:4px solid #2b6cb0;outline-offset:3px}.choice.picked{border:4px solid #2872ad;background:#eef6ff;box-shadow:0 0 0 2px #b5d9f2}.choice .choice-mark{font-size:17px;color:#51606d;margin-top:8px}.choice.picked .choice-mark{font-weight:700;color:#155b91}.choice.wrong{border-color:#c65342;background:#fff0ec}.choice.correct{border-color:#5c9b78;background:#f1faf4}.center-actions button:disabled{opacity:.45;cursor:not-allowed}#detectTypes{flex-basis:100%}#detectTypeHint{font-size:13px;color:#555;align-self:center}.visual{width:100%;display:grid;place-items:center}.choice svg{max-width:100%}
</style></head><body>
<header class="toolbar" id="toolbar"><span class="name">🐼 Matheforscher</span><button id="modeNumber" class="active">Zahl erforschen</button><button id="modeDetect">Fehler finden</button><button id="newNumber" class="primary">↻ Neue Zahl</button><button id="toggleNumber">Zahl verdecken</button><button id="toggleSettings">⚙ Lehrkraft</button><button id="fullscreen">⛶ Vollbild</button></header>
<div class="settings" id="settings" hidden><label>Zahl <input id="numberInput" type="number" min="0" max="100" value="23"></label><label>Zahlenraum <select id="range"><option value="20">0–20</option><option value="50">0–50</option><option value="100" selected>0–100</option></select></label><fieldset><legend>Darstellungen</legend><label><input type="checkbox" id="showDienes" checked> Dienes</label><label><input type="checkbox" id="showNeighbors" checked> Nachbarzahlen</label><label><input type="checkbox" id="showTens" checked> Nachbarzehner</label><label><input type="checkbox" id="showEquations" checked> Rechnungen</label><label><input type="checkbox" id="showLine"> Zahlenstrahl</label></fieldset><label>Zahlenstrahl <select id="lineScale"><option value="local">Zwischen Nachbarzehnern</option><option value="full">Gesamter Zahlenraum</option></select></label><button id="revealAll">Alle Lösungen zeigen</button><button id="hideAll">Alle Lösungen verdecken</button><fieldset id="detectTypes"><legend>Fehler finden · Darstellungen auswählen (mindestens 3)</legend><label><input type="checkbox" data-detect-type="neighbor" checked> Nachbarzahlen</label><label><input type="checkbox" data-detect-type="tens" checked> Nachbarzehner</label><label><input type="checkbox" data-detect-type="line" checked> Zahlenstrahl</label><label><input type="checkbox" data-detect-type="split" checked> Zahlzerlegung</label><label><input type="checkbox" data-detect-type="place" checked> Stellenwerttafel</label><label><input type="checkbox" data-detect-type="dienes" checked> Dienes</label><label><input type="checkbox" data-detect-type="add" checked> Rechnung</label><span id="detectTypeHint" role="status"></span></fieldset><button id="closeSettings">Einstellungen schließen</button></div>
<main class="board"><section id="explore"><div class="mainrow"><div class="panel dienes" id="dienesPanel"><svg id="dienesSvg" viewBox="0 0 500 320" role="img" aria-label="Dienes-Material"></svg><div class="pane-actions"><button class="smallbtn" data-reveal="dienes">Material verdecken</button></div></div><div class="panel tables"><div id="neighborsPanel"><div class="neighbor" id="neighbors"></div><div class="pane-actions"><button class="smallbtn" data-reveal="neighbors">Lösung zeigen</button></div></div><div id="tensPanel"><div class="neighbor" id="tens"></div><div class="pane-actions"><button class="smallbtn" data-reveal="tens">Lösung zeigen</button></div></div></div><div class="panel" id="equationsPanel"><div class="equations" id="equations"></div><div class="pane-actions"><button class="smallbtn" data-reveal="equations">Lösung zeigen</button></div></div></div><div class="linewrap" id="linePanel" hidden><svg id="lineSvg" viewBox="0 0 1000 140" role="img" aria-label="Zahlenstrahl"></svg><div class="pane-actions"><button class="smallbtn" data-reveal="line">Zahl aufdecken</button></div></div></section>
<section id="detect" hidden><h1 class="det-title">Was stimmt nicht?</h1><p class="det-sub">Eine Darstellung ist falsch. Begründe deine Entscheidung.</p><div class="choices" id="choices"></div><p class="det-sub" id="pickHint">Tippe auf die Darstellung, die du für falsch hältst.</p><div class="center-actions"><button id="solveDetect">Lösung aufdecken</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section></main><div class="footnote" id="footnote">Lehrkraft: Einstellungen über ⚙ öffnen · mit F11 Browser-Vollbild nutzen</div>
<script>
'use strict';
const $=id=>document.getElementById(id);const state={selectedCard:null,detectTypes:["neighbor","line","split","place","dienes","add"],n:23,max:100,mode:'explore',showNumber:true,reveal:{dienes:false,neighbors:false,tens:false,equations:false,line:false},detect:null,solved:false};
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
function nextNumber(){let n=state.mode==='detect'?rand(1,state.max-1):rand(0,state.max);if(state.max>1&&n===state.n)n=state.mode==='detect'?(n%(state.max-1))+1:(n+1)%(state.max+1);state.n=n;$('numberInput').value=n;state.showNumber=true;state.reveal={dienes:false,neighbors:false,tens:false,equations:false,line:false};state.solved=false;state.detect=makePuzzle(n);state.selectedCard=null;render()}
function bounds(n){return [Math.floor(n/10)*10,Math.min(state.max,Math.ceil(n/10)*10)]}
function svg(tag,attrs,inner=''){return `<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${String(v)}"`).join(' ')}>${inner}</${tag}>`}
function cube(x,y,s=37){const d=13,stroke='#262626',top='#c9bea5',front='#e2d7bf',side='#b9ad94';return `<polygon points="${x},${y} ${x+d},${y-d} ${x+s+d},${y-d} ${x+s},${y}" fill="${top}" stroke="${stroke}" stroke-width="1.8"/><polygon points="${x+s},${y} ${x+s+d},${y-d} ${x+s+d},${y+s-d} ${x+s},${y+s}" fill="${side}" stroke="${stroke}" stroke-width="1.8"/><rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${front}" stroke="${stroke}" stroke-width="1.8"/>`}
function rod(x,y,s=36){let out='';for(let i=0;i<10;i++)out+=cube(x+i*s,y,s);return out}
function dienesSvg(n){const z=Math.floor(n/10),e=n%10;let shapes='';const rodSize=35,unitSize=34;const rowGap=60;for(let i=0;i<z;i++){const col=i%1,row=i;shapes+=rod(18+col*0,18+row*rowGap,rodSize)}const cubesY=18+z*rowGap+10;for(let i=0;i<e;i++){shapes+=cube(18+(i%5)*51,cubesY+Math.floor(i/5)*54,unitSize)}if(n===0)shapes='<text x="240" y="135" text-anchor="middle" font-size="58" fill="#555">0</text>';const h=Math.max(150,cubesY+(e?95:15));return `<svg viewBox="0 0 410 ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${z} Zehnerstangen und ${e} Einerwürfel">${shapes}</svg>`}
function tableHtml(left,middle,right,heads){const values=[left,middle,right];return values.map((v,i)=>`<div class="cell ${i===1?'middle':''}"><span class="head ${i===1?'center':''}">${heads[i]}</span><span class="val ${v===null?'hiddenval':''}">${v===null?'&nbsp;':v}</span></div>`).join('')}
function lineHtml(){const n=state.n;let [lo,hi]=bounds(n);if($('lineScale').value==='full'){lo=0;hi=state.max}if(lo===hi){lo=Math.max(0,lo-10);hi=Math.min(state.max,hi+10)}const scale=v=>50+(v-lo)/(hi-lo)*900;let out=`<line x1="50" y1="68" x2="950" y2="68" stroke="#333" stroke-width="3"/>`;let step=$('lineScale').value==='full'?10:1;for(let v=lo;v<=hi;v+=step){let x=scale(v);out+=`<line x1="${x}" y1="${step===1&&v%5!==0?60:54}" x2="${x}" y2="82" stroke="#333" stroke-width="2"/>`;if(step===10||v%5===0||v===hi)out+=`<text x="${x}" y="112" text-anchor="middle" font-size="22" fill="#444">${v}</text>`}if(state.reveal.line){let x=scale(n);out+=`<circle cx="${x}" cy="68" r="9" fill="#e33c22"/><text x="${x}" y="40" font-size="25" font-weight="bold" text-anchor="middle" fill="#e33c22">${n}</text>`}return out}
function renderExplore(){const n=state.n;const [lo,hi]=bounds(n);$('dienesPanel').hidden=!$('showDienes').checked;$('neighborsPanel').hidden=!$('showNeighbors').checked;$('tensPanel').hidden=!$('showTens').checked;$('equationsPanel').hidden=!$('showEquations').checked;$('linePanel').hidden=!$('showLine').checked;$('dienesSvg').outerHTML=`<div id="dienesSvg">${state.reveal.dienes?dienesSvg(n):'<div style="height:210px" aria-label="Freie Fläche für eigene Darstellung"></div>'}</div>`;$('neighbors').innerHTML=tableHtml(state.reveal.neighbors?(n>0?n-1:"–"):null,state.showNumber?n:null,state.reveal.neighbors?(n<state.max?n+1:"–"):null,['V','Zahl','N']);$('tens').innerHTML=tableHtml(state.reveal.tens?lo:null,state.showNumber?n:null,state.reveal.tens?hi:null,['NZ','Zahl','NZ']);let eq1=`${n} + <span class="blank ${state.reveal.equations?'':'open'}">${hi-n}</span> = ${hi}`,eq2=`${n} − <span class="blank ${state.reveal.equations?'':'open'}">${n-lo}</span> = ${lo}`;$('equations').innerHTML=`<div class="eq">${state.showNumber?eq1:eq1.replace(String(n),'&nbsp;')}</div><div class="eq">${state.showNumber?eq2:eq2.replace(String(n),'&nbsp;')}</div>`;$('lineSvg').innerHTML=lineHtml();document.querySelectorAll('[data-reveal]').forEach(b=>{const k=b.dataset.reveal;b.textContent=state.reveal[k]?(k==='dienes'?'Material verdecken':'Lösung verdecken'):(k==='dienes'?'Material zeigen':'Lösung zeigen')})}
function detectDienes(z,e){
  // Zehnerstangen in maximal fünf Spalten, Einer separat in Fünferreihen.
  // Die SVG-Höhe wird aus der tatsächlichen Anzahl der Reihen berechnet.
  const width=330, rodW=22, cellH=12, top=16, rodGap=12;
  const rodsPerRow=5, rodHeight=cellH*10, rodRowGap=16;
  const rodRows=Math.ceil(z/rodsPerRow);
  let out='';
  for(let i=0;i<z;i++){
    const x=18+(i%rodsPerRow)*(rodW+rodGap);
    const y=top+Math.floor(i/rodsPerRow)*(rodHeight+rodRowGap);
    out+=`<rect x="${x}" y="${y}" width="${rodW}" height="${rodHeight}" fill="#e3d7bd" stroke="#514c44" stroke-width="1.7"/>`;
    for(let j=1;j<10;j++)out+=`<line x1="${x}" y1="${y+j*cellH}" x2="${x+rodW}" y2="${y+j*cellH}" stroke="#6e6455" stroke-width="1"/>`;
  }
  const unitsTop=top+rodRows*(rodHeight+rodRowGap)+(z?4:0);
  for(let i=0;i<e;i++){
    const x=18+(i%5)*27,y=unitsTop+Math.floor(i/5)*29;
    out+=`<rect x="${x}" y="${y}" width="21" height="21" fill="#e3d7bd" stroke="#514c44" stroke-width="1.5"/>`;
  }
  const height=Math.max(95,unitsTop+Math.ceil(e/5)*29+12);
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${z} Zehnerstangen mit jeweils zehn Segmenten und ${e} Einerwürfel">${out}</svg>`;
}
function detectLine(n,shown){let lo=Math.floor(n/10)*10,hi=lo+10;if(n%10===0){lo=Math.max(0,n-10);hi=n+10}if(hi>state.max){hi=state.max;lo=Math.max(0,hi-10)}let x=v=>24+(v-lo)/(hi-lo)*270;let out='<line x1="24" y1="70" x2="294" y2="70" stroke="#444" stroke-width="3"/>';for(let v=lo;v<=hi;v++){let xx=x(v);out+=`<line x1="${xx}" y1="${v%5===0?59:64}" x2="${xx}" y2="79" stroke="#444" stroke-width="1.7"/>`;if(v===lo||v===hi||v%5===0)out+=`<text x="${xx}" y="103" font-size="16" text-anchor="middle" fill="#444">${v}</text>`}out+=`<circle cx="${x(shown)}" cy="70" r="7" fill="#d94e32"/><text x="${x(shown)}" y="45" font-size="23" font-weight="bold" text-anchor="middle" fill="#d94e32">${shown}</text>`;return `<svg viewBox="0 0 320 120">${out}</svg>`}
function makePuzzle(n){
  // Restrict random error generation to values which can be shown unambiguously.
  const max=state.max, z=Math.floor(n/10),e=n%10, lo=Math.floor(n/10)*10;
  const types=[];
  if(n>=1&&n<=max-1)types.push({kind:'neighbor',label:'Nachbarzahlen'});
  if(n>=1&&n<=max-1)types.push({kind:'line',label:'Zahlenstrahl'});
  if(n>=1&&n<=max-1&&n%10!==0)types.push({kind:'tens',label:'Nachbarzehner'});
  if(n>=1)types.push({kind:'split',label:'Zahlzerlegung'});
  if(n>=1)types.push({kind:'place',label:'Stellenwerttafel'});
  if(n>=1&&n<=99)types.push({kind:'dienes',label:'Dienes-Material'});
  if(n>=1&&n<=max-1)types.push({kind:'add',label:'Rechnung'});
  for(let i=types.length-1;i>0;i--){const j=rand(0,i);[types[i],types[j]]=[types[j],types[i]]}
  const enabled=types.filter(t=>state.detectTypes.includes(t.kind));const selected=enabled.slice(0,3),wrongIndex=rand(0,2);
  return {n,cards:selected.map((t,i)=>{const wrong=i===wrongIndex;let visual='',correction='';
    if(t.kind==='neighbor') {const left=n-1+(wrong?1:0);visual=`<svg viewBox="0 0 320 130"><text x="52" y="28" text-anchor="middle" font-size="17" fill="#666">Vorgänger</text><text x="160" y="28" text-anchor="middle" font-size="17" fill="#666">Zahl</text><text x="268" y="28" text-anchor="middle" font-size="17" fill="#666">Nachfolger</text><path d="M0 42 H320" stroke="#555" stroke-width="2"/><text x="52" y="94" text-anchor="middle" font-size="42">${left}</text><text x="160" y="94" text-anchor="middle" font-size="42">${n}</text><text x="268" y="94" text-anchor="middle" font-size="42">${n+1}</text></svg>`;correction=`Vorgänger: ${n-1}, Nachfolger: ${n+1}`}
    if(t.kind==='tens'){const low=Math.floor(n/10)*10,high=low+10;const shownHigh=wrong?high-10:high;visual=`<svg viewBox="0 0 320 130"><text x="55" y="27" text-anchor="middle" font-size="17" fill="#666">NZ</text><text x="160" y="27" text-anchor="middle" font-size="17" fill="#666">Zahl</text><text x="265" y="27" text-anchor="middle" font-size="17" fill="#666">NZ</text><path d="M0 42 H320" stroke="#555" stroke-width="2"/><text x="55" y="96" text-anchor="middle" font-size="40">${low}</text><text x="160" y="96" text-anchor="middle" font-size="40">${n}</text><text x="265" y="96" text-anchor="middle" font-size="40">${shownHigh}</text></svg>`;correction=`Nachbarzehner von ${n}: ${low} und ${high}`}
    if(t.kind==='line'){const shown=wrong?(n%10===0?n-1:n+1):n;visual=detectLine(n,shown);correction=`Die ${n} muss an ihrer richtigen Stelle markiert sein.`}
    if(t.kind==='split'){const val=wrong?n+1:n;visual=`<div class="mathline">${z*10} + ${e} = ${val}</div>`;correction=`${z*10} + ${e} = ${n}`}
    if(t.kind==='place'){const zz=wrong?z+1:z;visual=`<div class="pv"><div class="pvhead">Z</div><div class="pvhead">E</div><div class="pvval">${zz}</div><div class="pvval">${e}</div></div>`;correction=`${z} Zehner und ${e} Einer`}
    if(t.kind==='dienes'){const zz=wrong&&e===0?z-1:z;const ee=wrong&&e!==0?(e===9?e-1:e+1):e;visual=detectDienes(zz,ee);correction=`${z} Zehner und ${e} Einer`}
    if(t.kind==='add'){const first=Math.max(1,Math.floor(n/2));const second=n-first;const shownSecond=wrong?second+1:second;visual=`<div class="mathline">${first} + ${shownSecond} = ${n}</div>`;correction=`${first} + ${second} = ${n}`}
    return {label:t.label,visual,truth:!wrong,correct:correction}
  }),wrongIndex}}
function renderDetect(){
 if(!state.detect)state.detect=makePuzzle(state.n);
 $('choices').innerHTML=state.detect.cards.map((c,i)=>`<button type="button" aria-pressed="${state.selectedCard===i}" class="choice ${state.selectedCard===i?'picked':''} ${state.solved?(c.truth?'correct':'wrong'):''}" data-choice="${i}"><span class="letter">${'ABC'[i]} · ${c.label}</span><div class="visual">${c.visual}</div><span class="choice-mark">${state.selectedCard===i?'✓ Ausgewählt':'Auswählen'}</span></button>`).join('');
 document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{if(state.solved)return;state.selectedCard=Number(btn.dataset.choice);renderDetect()});
 $('solveDetect').disabled=state.selectedCard===null&&!state.solved;
 $('feedback').textContent=state.solved?(state.selectedCard===state.detect.wrongIndex?'Richtig erkannt! ':'Noch nicht ganz. ')+`Darstellung ${'ABC'[state.detect.wrongIndex]} ist falsch. Richtig: ${state.detect.cards[state.detect.wrongIndex].correct}`:'';
 $('pickHint').textContent=state.solved?'Besprecht: Warum ist diese Darstellung falsch?':state.selectedCard===null?'Tippe auf die Darstellung, die du für falsch hältst.':`Karte ${'ABC'[state.selectedCard]} gewählt. Jetzt kannst du die Lösung anzeigen.`;
 $('solveDetect').textContent=state.solved?'Lösung verbergen':'Lösung anzeigen';
}
function resetDetect(){state.selectedCard=null;state.solved=false;state.detect=makePuzzle(state.n)}
function updateDetectTypeHint(){const count=state.detectTypes.length;$('detectTypeHint').textContent=`${count} ausgewählt · pro Rätsel erscheinen 3`;}
document.querySelectorAll('[data-detect-type]').forEach(box=>box.onchange=()=>{
 const selected=[...document.querySelectorAll('[data-detect-type]:checked')].map(x=>x.dataset.detectType);
 if(selected.length<3){box.checked=true;$('detectTypeHint').textContent='Bitte mindestens 3 Darstellungen auswählen.';return}
 state.detectTypes=selected;updateDetectTypeHint();resetDetect();render();
});updateDetectTypeHint();
function render(){const d=state.mode==='detect';$('explore').hidden=d;$('detect').hidden=!d;$('modeNumber').classList.toggle('active',!d);$('modeDetect').classList.toggle('active',d);$('toggleNumber').hidden=d;$('toggleNumber').textContent=state.showNumber?'Zahl verdecken':'Zahl zeigen';$('newNumber').textContent=d?'↻ Neues Rätsel':'↻ Neue Zahl';if(d)renderDetect();else renderExplore()}
$('newNumber').onclick=nextNumber;$('modeNumber').onclick=()=>{state.mode='explore';render()};$('modeDetect').onclick=()=>{state.mode='detect';if(state.n===0||state.n===state.max){state.n=Math.max(1,Math.min(state.max-1,state.n));$('numberInput').value=state.n}resetDetect();render()};$('toggleNumber').onclick=()=>{state.showNumber=!state.showNumber;render()};$('toggleSettings').onclick=()=>{$('settings').hidden=!$('settings').hidden};$('closeSettings').onclick=()=>{$('settings').hidden=true};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('numberInput').onchange=e=>{state.n=Math.max(state.mode==='detect'?1:0,Math.min(state.mode==='detect'?state.max-1:state.max,Math.round(Number(e.target.value)||0)));e.target.value=state.n;if(state.mode==='explore'){Object.keys(state.reveal).forEach(k=>state.reveal[k]=false);state.showNumber=true}resetDetect();render()};$('range').onchange=e=>{state.max=Number(e.target.value);$('numberInput').max=state.max;if(state.n>state.max)state.n=state.max;if(state.mode==='detect')state.n=Math.max(1,Math.min(state.max-1,state.n));$('numberInput').value=state.n;resetDetect();render()};['showDienes','showNeighbors','showTens','showEquations','showLine','lineScale'].forEach(id=>$(id).onchange=render);document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{state.reveal[b.dataset.reveal]=!state.reveal[b.dataset.reveal];render()});$('revealAll').onclick=()=>{Object.keys(state.reveal).forEach(k=>state.reveal[k]=true);render()};$('hideAll').onclick=()=>{Object.keys(state.reveal).forEach(k=>state.reveal[k]=false);render()};$('solveDetect').onclick=()=>{if(state.selectedCard===null)return;state.solved=!state.solved;render()};resetDetect();render();
</script></body></html>
